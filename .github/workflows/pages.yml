# The installable web build on GitHub Pages. Builds on every push; deploys
# only from the repository's default branch, whatever it is named (the
# github-pages environment refuses other branches; this repo has no 'main').
# Pages is switched on by hand once: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invariants
        run: node --test "test/*.test.js"
      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons src _site/
          touch _site/.nojekyll
          for f in index.html manifest.webmanifest sw.js icons/icon-192.png icons/icon-512.png; do
            test -s "_site/$f" || { echo "missing or empty: _site/$f"; exit 1; }
          done
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
